name: Fork - Propose upstream release
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * *'
permissions:
  contents: read
concurrency:
  group: fork-upstream-release-pr
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository != 'sintax-tech/mcp-for-nextcloud'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Propose update or report conflict
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          FORK_REPOSITORY: ${{ github.repository }}
          FORK_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/propose-upstream.py
