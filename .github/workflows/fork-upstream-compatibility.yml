name: Fork - Upstream merge compatibility
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: mbstring, intl, gd, zip, sqlite3, pdo_sqlite
          coverage: none
      - name: Fetch current upstream branch and five stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add compatibility-upstream https://github.com/sintax-tech/mcp-for-nextcloud.git
          git fetch compatibility-upstream main
          gh api 'repos/sintax-tech/mcp-for-nextcloud/releases?per_page=100' \
            --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name][:5][]' > "$RUNNER_TEMP/upstream-tags"
          while IFS= read -r tag; do
            git check-ref-format "refs/tags/$tag"
            git fetch compatibility-upstream "refs/tags/$tag:refs/compatibility/releases/$tag"
          done < "$RUNNER_TEMP/upstream-tags"
      - name: Test each merge in a disposable branch
        run: |
          set -- refs/remotes/compatibility-upstream/main
          while IFS= read -r tag; do set -- "$@" "refs/compatibility/releases/$tag"; done < "$RUNNER_TEMP/upstream-tags"
          export MCP_COMPAT_RUN_TESTS=1
          sh scripts/check-upstream.sh "$@"
      - name: Explain failures
        if: failure()
        run: echo 'Upstream merge or compatibility tests failed. Manual resolution is required; nothing was merged or published.' >> "$GITHUB_STEP_SUMMARY"
